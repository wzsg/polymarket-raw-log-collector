[project]
name = "polymarket-raw-log-collector"
version = "0.1.0"
description = "Configurable concurrent Polygon raw log collector with Parquet storage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "eth-hash[pycryptodome]>=0.7,<1",
    "httpx>=0.28,<1",
    "pyarrow>=24,<25",
    "python-dotenv>=1.1,<2",
]

[project.scripts]
polymarket-raw-log-collector = "polymarket_raw_log_collector.cli:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
